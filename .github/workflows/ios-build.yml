name: Compile Direct iOS Package
on: [push, workflow_dispatch]

jobs:
  pack-app:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository Files
        uses: actions/checkout@v4

      - name: Build Application Directory Structure
        run: |
          mkdir -p Payload/Application.app
          # Copy your current files into the executable payload folder
          cp -r * Payload/Application.app/ 2>/dev/null || true
          zip -r standalone_app.ipa Payload/

      - name: Export Application Package
        uses: actions/upload-artifact@v4
        with:
          name: DownloadableIPAPackage
          path: standalone_app.ipa
